# Databricks Apps deployment config.
#
# Note what is NOT here: an API-key secret. api.weather.gov authenticates with
# a User-Agent header and nothing else, so the only secret this app needs is
# the Lakebase connection URL.

command:
  - "python"
  - "app.py"

env:
  # Lakebase connection URL, stored as secret `database/lakebase-url`.
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

  # NWS asks clients to identify themselves with a contact address. Replace
  # this with a real one before deploying anything that syncs regularly.
  - name: NWS_API_BASE_URL
    value: "https://api.weather.gov"
  - name: NWS_USER_AGENT
    value: "(databricks-lakebase-weather-rag, your-email@example.com)"

  # Corpus defaults for POST /weather/sync when the body omits them.
  - name: NWS_PRODUCT_TYPES
    value: "AFD,HWO,ESF"
  - name: NWS_OFFICES
    value: "OKX,LWX,MPX,FWD,SEW,MFL,BOU,OUN,SLC,TAE"

  # Must match the VECTOR(n) width of weather_embeddings. Changing this
  # requires an ALTER TABLE and a full re-embed.
  - name: EMBEDDING_MODEL
    value: "sentence-transformers/all-MiniLM-L6-v2"
  - name: CHUNK_SIZE
    value: "900"
  - name: CHUNK_OVERLAP
    value: "150"

  - name: WEATHER_DOCUMENTS_TABLE
    value: "weather_documents"
  - name: WEATHER_EMBEDDINGS_TABLE
    value: "weather_embeddings"

  # HuggingFace cache. Apps run with a read-only home directory; /tmp is
  # writable, and without this the model download fails on first request.
  - name: HF_HOME
    value: "/tmp/.cache/huggingface"
